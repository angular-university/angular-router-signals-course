<mat-card class="login-page">
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form class="login-form" (submit)="login(); $event.preventDefault()">

      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" [formField]="loginForm.email">
        @if (loginForm.email().touched() && loginForm.email().errors().length) {
          <mat-error>{{ loginForm.email().errors()[0].message }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" [formField]="loginForm.password">
        @if (loginForm.password().touched() && loginForm.password().errors().length) {
          <mat-error>{{ loginForm.password().errors()[0].message }}</mat-error>
        }
      </mat-form-field>

      <button mat-raised-button color="primary"
              type="submit"
              [disabled]="loginForm().invalid()">Login</button>

    </form>
  </mat-card-content>
</mat-card>
