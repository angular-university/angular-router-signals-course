@if (lesson(); as lesson) {
    <div class="lesson-detail">

        <a class="back-link" [routerLink]="['../..']">
            <span class="material-icons" aria-hidden="true">arrow_back</span>
            Back to Lessons
        </a>

        <div class="lesson-card">
            <div class="lesson-header">
                <span class="lesson-number">Lesson {{ lesson.seqNo }}</span>
                <h2 class="lesson-title">{{ lesson.description }}</h2>
                <span class="lesson-duration">
                    <span class="material-icons" aria-hidden="true">schedule</span>
                    {{ lesson.duration }}
                </span>
            </div>

            <div class="video-wrapper">
                @if (prevLessonLink(); as prevLink) {
                    <a class="nav-btn prev" [routerLink]="prevLink" title="Previous lesson">
                        <span class="material-icons" aria-hidden="true">chevron_left</span>
                    </a>
                }

                <div class="video-container">
                    <iframe
                        [src]="('https://www.youtube.com/embed/' + lesson.videoId) | safeUrl"
                        frameborder="0"
                        allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        title="{{ lesson.description }}">
                    </iframe>
                </div>

                @if (nextLessonLink(); as nextLink) {
                    <a class="nav-btn next" [routerLink]="nextLink" title="Next lesson">
                        <span class="material-icons" aria-hidden="true">chevron_right</span>
                    </a>
                }
            </div>
        </div>

    </div>
}
