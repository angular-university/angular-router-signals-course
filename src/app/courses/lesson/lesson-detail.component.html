@if (lesson(); as lesson) {
    <div class="lesson-detail">

        <a class="back-link" [routerLink]="['../..']">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back to Lessons
        </a>

        <div class="lesson-card">
            <div class="lesson-header">
                <span class="lesson-number">Lesson {{ lesson.seqNo }}</span>
                <h2 class="lesson-title">{{ lesson.description }}</h2>
                <span class="lesson-duration">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/>
                    </svg>
                    {{ lesson.duration }}
                </span>
            </div>

            <div class="video-wrapper">
                @if (prevLessonLink(); as prevLink) {
                    <a class="nav-btn prev" [routerLink]="prevLink" title="Previous lesson">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                    </a>
                }

                <div class="video-container">
                    <iframe
                        [src]="('https://www.youtube.com/embed/' + lesson.videoId) | safeUrl"
                        frameborder="0"
                        allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        title="{{ lesson.description }}">
                    </iframe>
                </div>

                @if (nextLessonLink(); as nextLink) {
                    <a class="nav-btn next" [routerLink]="nextLink" title="Next lesson">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </a>
                }
            </div>
        </div>

    </div>
}
