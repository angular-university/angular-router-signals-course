<div class="page-container">
    <div class="course-layout">

        <aside class="course-sidebar">
            <div class="course-hero">
                <img class="course-image" [src]="course().iconUrl" [alt]="course().description">
                <h1 class="course-title">{{ course().description }}</h1>
                @if (couponCode()) {
                    <div class="coupon-badge">
                        🎉 Use code <strong>{{ couponCode() }}</strong> for a discount!
                    </div>
                }
            </div>
        </aside>

        <div class="course-content">

            <div class="title-edit-bar">
                <label class="title-label" for="course-title">Course Title</label>
                <div class="title-field-row">
                    <input id="course-title" type="text" class="form-control"
                           [formField]="form.title"
                           placeholder="Course title">
                    @if (form.title().dirty()) {
                        <span class="unsaved-hint">
                            <span class="material-icons">edit</span>
                            Unsaved changes
                        </span>
                    }
                </div>
            </div>

            <router-outlet />

        </div>

    </div>
</div>
