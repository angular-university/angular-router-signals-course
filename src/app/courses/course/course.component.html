<div class="page-container">
    <div class="course-layout">

        <aside class="course-sidebar">
            <div class="course-hero">
                <img class="course-image" [src]="course().iconUrl" [alt]="course().description">
                <h1 class="course-title">{{ course().description }}</h1>
                @if (couponCode()) {
                    <div class="coupon-badge">
                        🎉 Use code <strong>{{ couponCode() }}</strong> for a discount!
                    </div>
                }
            </div>

            <div class="edit-section">
                <label class="edit-label" for="course-title">Edit Title</label>
                <input id="course-title" type="text" class="form-control"
                       [value]="titleModel()"
                       (input)="onTitleInput($event)">
                @if (hasUnsavedChanges()) {
                    <p class="unsaved-hint">
                        <span class="material-icons">edit</span>
                        Unsaved changes
                    </p>
                }
            </div>
        </aside>

        <div class="course-content">
            <router-outlet />
        </div>

    </div>
</div>
