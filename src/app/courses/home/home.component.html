<div class="page-container">

    <div class="courses-panel-header">
        <div class="courses-panel-header-left">
            <div class="section-icon">
                <span class="material-icons">grid_view</span>
            </div>
            <h2 class="courses-panel-title">All Courses</h2>
        </div>
    </div>

    @if (beginnerCourses().length > 0) {
        <section class="course-section">
            <div class="section-heading">
                <span class="heading-accent"></span>
                <h2>Beginner Courses</h2>
            </div>
            <courses-card-list
                [courses]="beginnerCourses()"
                (coursesChanged)="reloadCourses()" />
        </section>
    }

    @if (advancedCourses().length > 0) {
        <section class="course-section">
            <div class="section-heading">
                <span class="heading-accent"></span>
                <h2>Advanced Courses</h2>
            </div>
            <courses-card-list
                [courses]="advancedCourses()"
                (coursesChanged)="reloadCourses()" />
        </section>
    }

</div>
