
<div class="courses-panel">

    <h3 class="page-title">All Courses</h3>

    <mat-tab-group>

        <mat-tab label="Beginners">

            <courses-card-list [courses]="beginnerCourses()" (coursesChanged)="reloadCourses()" />

        </mat-tab>

        <mat-tab label="Advanced">

            <courses-card-list [courses]="advancedCourses()" (coursesChanged)="reloadCourses()" />

        </mat-tab>

    </mat-tab-group>

</div>
