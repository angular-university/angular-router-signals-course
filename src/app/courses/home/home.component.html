<div class="page-container">

    <div class="hero">
        <h1 class="hero-title">All Courses</h1>
        <p class="hero-subtitle">Learn modern Angular with signals, standalone components and zoneless architecture</p>
    </div>

    @if (beginnerCourses().length > 0) {
        <section class="course-section">
            <div class="section-heading">
                <span class="heading-accent"></span>
                <h2>Beginner Courses</h2>
            </div>
            <courses-card-list
                [courses]="beginnerCourses()"
                (coursesChanged)="reloadCourses()" />
        </section>
    }

    @if (advancedCourses().length > 0) {
        <section class="course-section">
            <div class="section-heading">
                <span class="heading-accent"></span>
                <h2>Advanced Courses</h2>
            </div>
            <courses-card-list
                [courses]="advancedCourses()"
                (coursesChanged)="reloadCourses()" />
        </section>
    }

</div>
