<nav class="top-nav">
    <div class="nav-inner">

        <a class="nav-brand" routerLink="/courses">
            <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M18 2L3 7.5l2.5 22L18 34l12.5-4.5L33 7.5 18 2z" fill="#e43369"/>
                <path d="M18 6.5l-9 18h3.4l1.8-4.5h7.6l1.8 4.5H27L18 6.5zm0 6l2.7 6h-5.4L18 12.5z" fill="white"/>
            </svg>
            <span class="brand-text">Angular University</span>
        </a>

        <ul class="nav-links">
            <li>
                <a class="nav-link" routerLink="/courses"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="{exact: true}">
                    Courses
                </a>
            </li>
            <li>
                <a class="nav-link" routerLink="/about"
                   routerLinkActive="active">
                    About
                </a>
            </li>
            @if (auth.isLoggedOut()) {
                <li>
                    <a class="nav-link" routerLink="/login"
                       routerLinkActive="active">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                        </svg>
                        Login
                    </a>
                </li>
            }
        </ul>

        <div class="nav-actions">
            @if (auth.isLoggedIn()) {
                <a class="btn-icon" title="Helpdesk Chat"
                   [routerLink]="[{outlets: {chat: ['helpdesk-chat']}}]">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
                    </svg>
                </a>
            }
            @if (auth.isLoggedIn()) {
                <button class="btn-icon" (click)="logout()" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM7 12c0 2.76 1.12 5.26 2.93 7.07L8.5 20.5A11.95 11.95 0 0 1 5 12c0-3.31 1.34-6.3 3.5-8.5l1.43 1.43A9.94 9.94 0 0 0 7 12z"/>
                    </svg>
                </button>
            }
            @if (auth.user(); as user) {
                <img class="nav-avatar" [src]="user.pictureUrl" alt="User avatar">
            }
        </div>

    </div>
</nav>

<messages />
<loading [detectRoutingOngoing]="true" />

<main class="app-main">
    <router-outlet />
</main>

<router-outlet name="chat" />
