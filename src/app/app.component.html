<header class="top-nav">
    <div class="nav-inner">

        <a class="nav-brand" routerLink="/courses">
            <ng-logo [size]="28" class="brand-icon" />
            <span class="brand-text">Angular Router In Depth (Signals Edition)</span>
        </a>

        <ul class="nav-links">
            <li>
                <a class="nav-link" routerLink="/courses"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="{exact: true}">
                    <span class="material-icons">grid_view</span>
                    Courses
                </a>
            </li>
            <li>
                <a class="nav-link" routerLink="/about"
                   routerLinkActive="active"
                   ariaCurrentWhenActive="page">
                    <span class="material-icons">info</span>
                    About
                </a>
            </li>
            @if (auth.isLoggedOut()) {
                <li>
                    <a class="nav-link" routerLink="/login"
                       routerLinkActive="active"
                       ariaCurrentWhenActive="page">
                        <span class="material-icons">person</span>
                        Login
                    </a>
                </li>
            }
        </ul>

        <div class="nav-actions">
            @if (auth.isLoggedIn()) {
                <a class="btn-icon" title="Helpdesk Chat"
                   [routerLink]="[{outlets: {chat: ['helpdesk-chat']}}]">
                    <span class="material-icons">chat_bubble</span>
                </a>
            }
            @if (auth.isLoggedIn()) {
                <button class="btn-icon" (click)="logout()" title="Logout">
                    <span class="material-icons">logout</span>
                </button>
            }
            @if (auth.user()) {
                <div class="nav-avatar" aria-label="Logged in">
                    <ng-logo [size]="21" />
                </div>
            }
        </div>

    </div>
</header>

<messages />
<loading [detectRoutingOngoing]="true" />
<confirm-dialog />

<main class="app-main">
    <router-outlet (activate)="onActivate($event)" (deactivate)="onDeactivate($event)" />
</main>

<router-outlet name="chat" />

<dev-toolbar />
