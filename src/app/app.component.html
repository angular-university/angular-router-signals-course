<header class="top-nav">
    <div class="nav-inner">

        <a class="nav-brand" routerLink="/courses">
            <svg class="brand-icon" width="26" height="28" viewBox="0 0 223 236" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="nav-ng-b" x1="49.009" x2="225.829" y1="213.75" y2="129.722" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#E40035"/><stop offset=".24" stop-color="#F60A48"/>
                        <stop offset=".352" stop-color="#F20755"/><stop offset=".494" stop-color="#DC087D"/>
                        <stop offset=".745" stop-color="#9717E7"/><stop offset="1" stop-color="#6C00F5"/>
                    </linearGradient>
                    <linearGradient id="nav-ng-c" x1="41.025" x2="156.741" y1="28.344" y2="160.344" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FF31D9"/><stop offset="1" stop-color="#FF5BE1" stop-opacity="0"/>
                    </linearGradient>
                    <clipPath id="nav-ng-a"><path fill="#fff" d="M0 0h223v236H0z"/></clipPath>
                </defs>
                <g clip-path="url(#nav-ng-a)">
                    <path fill="url(#nav-ng-b)" d="m222.077 39.192-8.019 125.923L137.387 0l84.69 39.192Zm-53.105 162.825-57.933 33.056-57.934-33.056 11.783-28.556h92.301l11.783 28.556ZM111.039 62.675l30.357 73.803H80.681l30.358-73.803ZM7.937 165.115 0 39.192 84.69 0 7.937 165.115Z"/>
                    <path fill="url(#nav-ng-c)" d="m222.077 39.192-8.019 125.923L137.387 0l84.69 39.192Zm-53.105 162.825-57.933 33.056-57.934-33.056 11.783-28.556h92.301l11.783 28.556ZM111.039 62.675l30.357 73.803H80.681l30.358-73.803ZM7.937 165.115 0 39.192 84.69 0 7.937 165.115Z"/>
                </g>
            </svg>
            <span class="brand-text">Angular Router In Depth (Signals Edition)</span>
        </a>

        <ul class="nav-links">
            <li>
                <a class="nav-link" routerLink="/courses"
                   routerLinkActive="active"
                   ariaCurrentWhenActive="page"
                   [routerLinkActiveOptions]="{exact: true}">
                    <span class="material-icons">grid_view</span>
                    Courses
                </a>
            </li>
            <li>
                <a class="nav-link" routerLink="/about"
                   routerLinkActive="active"
                   ariaCurrentWhenActive="page">
                    <span class="material-icons">info</span>
                    About
                </a>
            </li>
            @if (auth.isLoggedOut()) {
                <li>
                    <a class="nav-link" routerLink="/login"
                       routerLinkActive="active"
                       ariaCurrentWhenActive="page">
                        <span class="material-icons">person</span>
                        Login
                    </a>
                </li>
            }
        </ul>

        <div class="nav-actions">
            @if (auth.isLoggedIn()) {
                <a class="btn-icon" title="Helpdesk Chat"
                   [routerLink]="[{outlets: {chat: ['helpdesk-chat']}}]">
                    <span class="material-icons">chat_bubble</span>
                </a>
            }
            @if (auth.isLoggedIn()) {
                <button class="btn-icon" (click)="logout()" title="Logout">
                    <span class="material-icons">logout</span>
                </button>
            }
            @if (auth.user(); as user) {
                <img class="nav-avatar" [src]="user.pictureUrl" alt="User avatar">
            }
        </div>

    </div>
</header>

<messages />
<loading [detectRoutingOngoing]="true" />
<confirm-dialog />

<main class="app-main">
    <router-outlet />
</main>

<router-outlet name="chat" />
