<div class="dev-toolbar">
    <span class="dev-toolbar-label">Feature Flags</span>
    @for (flag of flags.keys(); track flag) {
        <label class="flag-toggle">
            <input type="checkbox"
                   [checked]="flags.isEnabled(flag)"
                   (change)="toggle(flag)" />
            {{ flag }}
        </label>
    }
    <button type="button" class="demo-error-btn" (click)="demoError()">
        Go to /fail
    </button>
</div>
